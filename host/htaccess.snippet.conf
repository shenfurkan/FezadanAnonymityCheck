# public_html/.htaccess — anonymity-check redirects and local path access.
#
# Place inside the existing <IfModule mod_rewrite.c> block:
#   - sitemap rule: before the generic MVC fallback, next to the robots.txt rule
#   - anonymity rules: after the security-deny rules and before the furkan/MVC rules
#
# The physical directory public_html/anonymitycheck/ remains so the local
# entrypoint can rewrite the host to anonymitycheck.localhost for Docker tests.
# Production hosts are redirected to the dedicated origin before mod_dir adds
# a trailing slash to that directory.

# Always validate sitemap freshness in PHP. A retained cron/deploy output must
# never shadow new publications or removed URLs; host-specific routing stays in App.
RewriteRule ^(sitemap(?:_(?:main|notes|anonymity))?\.xml)$ index.php?url=$1 [L,QSA]

# Redirect before mod_dir adds a trailing slash to the physical legacy directory.
# Old API clients need 308 so a POST does not turn into a GET and lose its body.
RewriteCond %{HTTP_HOST} !(^|\.)localhost(?::[0-9]+)?$ [NC]
RewriteCond %{HTTP_HOST} !^(127\.0\.0\.1|\[::1\])(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteRule ^anonymitycheck(?:/(.*))?$ https://anonymitycheck.fezadan.org/$1 [R=308,L]
RewriteCond %{HTTP_HOST} !(^|\.)localhost(?::[0-9]+)?$ [NC]
RewriteCond %{HTTP_HOST} !^(127\.0\.0\.1|\[::1\])(?::[0-9]+)?$ [NC]
RewriteRule ^anonymitycheck(?:/(.*))?$ https://anonymitycheck.fezadan.org/$1 [R=301,L]

# Keep local path access for Docker and development.
RewriteRule ^anonymitycheck(?:/(.*))?$ anonymitycheck/index.php [L,QSA]

# Note: if you change ANONYMITY_SITE_URL, change both redirect targets above
# and the fallback origin in public_html/anonymitycheck/index.php.
